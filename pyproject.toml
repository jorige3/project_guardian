[project]
name = "project-guardian"
version = "1.1.0"
description = "A lightweight, modular static code analysis engine for Python codebases."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Kishore Kumar" }
]
dependencies = []

[project.scripts]
project-guardian = "agent:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
addopts = "--basetemp=temp_pytest"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
package = true

[tool.setuptools]
packages = ["analyzers", "models", "services"]
py-modules = ["agent"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"


